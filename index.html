<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="favicon-32.png">
<title>Flag Guesser</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js"></script>
<style>
  :root{
    --navy:#16233d;
    --navy-deep:#0e1830;
    --paper:#f2e9d3;
    --paper-dim:#e7dcbf;
    --brass:#c69a3d;
    --brass-dark:#9c7628;
    --teal:#2f6f62;
    --teal-dark:#204e44;
    --crimson:#a4372b;
    --ink:#2a2318;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  html{ height:100%; }
  html.locked, html.locked body{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    overflow:hidden;
    overscroll-behavior:none;
  }
  body{
    min-height:100vh;
    background:
      repeating-linear-gradient(0deg, rgba(255,255,255,0.045) 0px, rgba(255,255,255,0.045) 1px, transparent 1px, transparent 64px),
      repeating-linear-gradient(90deg, rgba(255,255,255,0.045) 0px, rgba(255,255,255,0.045) 1px, transparent 1px, transparent 64px),
      radial-gradient(circle at 50% 0%, rgba(255,255,255,0.06), transparent 60%),
      linear-gradient(180deg, var(--navy) 0%, var(--navy-deep) 100%);
    font-family:'Inter',sans-serif;
    color:var(--paper);
    display:flex;
    align-items:flex-start;
    justify-content:center;
    padding:40px 16px 60px;
  }
  body.playing{ padding:12px 12px 16px; }

  .wrap{ width:100%; max-width:560px; }
  html.locked .wrap{
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    max-height:100%;
  }

  .masthead{ text-align:center; margin-bottom:18px; }
  .masthead .eyebrow{
    font-family:'JetBrains Mono',monospace;
    font-size:11px; letter-spacing:0.28em; text-transform:uppercase;
    color:var(--brass); margin:0 0 8px;
  }
  .masthead h1{
    font-family:'Fraunces',serif; font-weight:600; font-size:34px;
    margin:0; letter-spacing:0.01em;
  }
  .masthead h1 span{ color:var(--brass); font-style:italic; font-weight:500; }

  .mode-toggle{
    display:inline-flex;
    margin-top:14px;
    background:rgba(255,255,255,0.08);
    border-radius:30px;
    padding:3px;
    gap:2px;
  }
  .mode-toggle button{
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    letter-spacing:0.06em;
    text-transform:uppercase;
    padding:8px 16px;
    border-radius:24px;
    border:none;
    background:transparent;
    color:var(--paper);
    opacity:0.6;
    cursor:pointer;
  }
  .mode-toggle button.active{
    background:var(--brass);
    color:var(--navy-deep);
    opacity:1;
    font-weight:500;
  }

  .flag-bar{
    position:sticky;
    top:0;
    z-index:20;
    background:var(--paper);
    border-radius:6px;
    box-shadow:0 12px 24px rgba(0,0,0,0.28), inset 0 0 0 1px rgba(0,0,0,0.06);
    padding:14px 20px 16px;
    margin-bottom:10px;
  }

  .card{
    position:relative;
    background:var(--paper);
    color:var(--ink);
    border-radius:6px;
    box-shadow:0 24px 50px rgba(0,0,0,0.35), inset 0 0 0 1px rgba(0,0,0,0.06);
    padding:28px 28px 22px;
    background-image:
      radial-gradient(ellipse at top left, rgba(0,0,0,0.05), transparent 55%),
      radial-gradient(ellipse at bottom right, rgba(0,0,0,0.05), transparent 55%);
  }
  .card::before{
    content:"";
    position:absolute; inset:10px;
    border:1px solid rgba(42,35,24,0.25);
    border-radius:3px;
    pointer-events:none;
  }

  .row-top{
    display:flex; justify-content:space-between; align-items:baseline;
    font-family:'JetBrains Mono',monospace; font-size:12px;
    color:var(--teal-dark); margin-bottom:14px; letter-spacing:0.04em;
  }
  .row-top .lead{ font-weight:500; }

  .timer-track{
    height:5px; background:rgba(42,35,24,0.15); border-radius:3px;
    overflow:hidden; margin-bottom:16px;
  }
  .timer-fill{
    height:100%; width:100%; background:var(--teal-dark);
    transform-origin:left; transition:width 0.1s linear, background 0.3s ease;
  }
  .timer-fill.low{ background:var(--crimson); }

  .flag-stage{
    text-align:center; padding:26px 10px 22px; margin-bottom:20px;
    background:var(--paper-dim); border-radius:4px;
    box-shadow:inset 0 0 0 1px rgba(42,35,24,0.15);
    position:relative; overflow:hidden;
  }
  .flag-frame{
    display:inline-block;
    width:220px;
    max-width:80%;
    aspect-ratio:3/2;
    border-radius:4px;
    overflow:hidden;
    box-shadow:0 8px 18px rgba(0,0,0,0.22), inset 0 0 0 1px rgba(42,35,24,0.25);
    background:var(--paper-dim);
  }
  .flag-frame svg{ width:100%; height:100%; display:block; }
  .flag-frame img{ width:100%; height:100%; object-fit:contain; display:block; transition:opacity 0.18s ease; }
  .flag-frame.tight img{ object-fit:cover; }
  .flag-caption{
    margin-top:10px; font-family:'JetBrains Mono',monospace; font-size:11px;
    letter-spacing:0.18em; text-transform:uppercase; color:var(--teal-dark); opacity:0.75;
  }

  .options{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:18px; }
  .opt{
    font-family:'Inter',sans-serif; font-size:15px; font-weight:500;
    padding:14px 10px; text-align:center; background:#fffdf6;
    border:1.5px solid rgba(42,35,24,0.22); border-radius:4px; cursor:pointer;
    color:var(--ink); transition:transform 0.08s ease, border-color 0.15s ease, background 0.15s ease;
  }
  @media (hover:hover) and (pointer:fine){
    .opt:hover:not(:disabled){ border-color:var(--brass-dark); background:#fffaf0; }
  }
  .opt:active:not(:disabled){ transform:scale(0.98); }
  .opt:disabled{ cursor:default; }
  .opt.correct{ background:rgba(47,111,98,0.14); border-color:var(--teal-dark); color:var(--teal-dark); }
  .opt.wrong{ background:rgba(164,55,43,0.12); border-color:var(--crimson); color:var(--crimson); }
  .opt.reveal{ background:rgba(47,111,98,0.14); border-color:var(--teal-dark); color:var(--teal-dark); }

  .type-wrap{ margin-bottom:18px; }
  .type-input{
    width:100%; font-family:'Inter',sans-serif; font-size:17px; font-weight:500;
    padding:14px 16px; text-align:center; background:#fffdf6;
    border:1.5px solid rgba(42,35,24,0.22); border-radius:4px; color:var(--ink);
    transition:border-color 0.15s ease, background 0.15s ease, color 0.15s ease;
    outline:none;
  }
  .type-input:focus{ border-color:var(--brass-dark); }
  .type-input.good{ background:rgba(47,111,98,0.14); border-color:var(--teal-dark); color:var(--teal-dark); }
  .type-input.bad{ background:rgba(164,55,43,0.12); border-color:var(--crimson); color:var(--crimson); }
  .type-hint{
    font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--teal-dark);
    opacity:0.7; text-align:center; margin-top:8px; letter-spacing:0.05em;
  }

  .feedback-zone{ min-height:8px; margin-bottom:2px; }
  .answer-reveal{
    text-align:center;
    font-family:'JetBrains Mono',monospace;
    font-size:12px;
    color:rgba(42,35,24,0.65);
    padding:6px 0 0;
    animation:revealIn 0.25s ease forwards;
    opacity:0;
  }
  .answer-reveal strong{ font-family:'Inter',sans-serif; font-weight:600; color:var(--ink); }
  @keyframes revealIn{ from{opacity:0; transform:translateY(-2px);} to{opacity:1; transform:translateY(0);} }
  .stamp{
    font-family:'Fraunces',serif; font-weight:700; font-size:34px; line-height:1;
    width:64px; height:64px; display:flex; align-items:center; justify-content:center;
    border:4px solid; border-radius:50%;
    transform:rotate(-7deg) scale(0.5); opacity:0;
    animation:stampIn 0.42s cubic-bezier(.2,1.4,.4,1) forwards;
  }
  .stamp.pass{ color:var(--teal-dark); border-color:var(--teal-dark); }
  .stamp.fail{ color:var(--crimson); border-color:var(--crimson); }
  @keyframes stampIn{
    0%{ transform:rotate(-20deg) scale(2.6); opacity:0; }
    60%{ opacity:1; }
    100%{ transform:rotate(-7deg) scale(1); opacity:1; }
  }

  .statbar{
    display:flex; justify-content:space-between; margin-top:14px; padding-top:14px;
    border-top:1px dashed rgba(42,35,24,0.3); font-family:'JetBrains Mono',monospace;
    font-size:11px; color:var(--teal-dark); letter-spacing:0.05em;
  }
  .statbar b{ font-size:14px; color:var(--ink); font-family:'Inter',sans-serif; display:block; margin-top:2px; }

  .start{ text-align:center; }
  .start p{ font-size:14px; color:var(--teal-dark); line-height:1.6; margin:0 0 20px; }
  .begin-btn{
    width:100%; font-family:'JetBrains Mono',monospace; font-size:13px; letter-spacing:0.14em;
    text-transform:uppercase; padding:14px; background:var(--navy); color:var(--paper);
    border:none; border-radius:4px; cursor:pointer;
  }
  @media (hover:hover) and (pointer:fine){
    .begin-btn:hover{ background:var(--navy-deep); }
  }

  .end{ text-align:center; }
  .end .rank{ font-family:'Fraunces',serif; font-weight:600; font-size:26px; margin:6px 0 4px; }
  .end .rank-sub{ font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--teal-dark); margin-bottom:20px; }
  .end-stats{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:22px; }
  .end-stats div{ background:var(--paper-dim); border-radius:4px; padding:14px 6px; box-shadow:inset 0 0 0 1px rgba(42,35,24,0.15); }
  .end-stats .num{ font-family:'Fraunces',serif; font-weight:600; font-size:24px; display:block; }
  .end-stats .lbl{ font-family:'JetBrains Mono',monospace; font-size:10px; letter-spacing:0.1em; text-transform:uppercase; color:var(--teal-dark); }
  .missed{
    text-align:left; font-size:13px; margin-bottom:20px; max-height:150px; overflow-y:auto;
    background:var(--paper-dim); border-radius:4px; padding:10px 14px; box-shadow:inset 0 0 0 1px rgba(42,35,24,0.15);
  }
  .missed .row{ padding:4px 0; display:flex; align-items:center; justify-content:space-between; }
  .missed .name{ display:flex; align-items:center; gap:8px; }
  .missed .thumb{ width:26px; height:18px; border-radius:2px; overflow:hidden; box-shadow:inset 0 0 0 1px rgba(42,35,24,0.3); flex-shrink:0; }
  .missed .thumb svg{ width:100%; height:100%; display:block; }

  .next-btn{
    display:block; width:100%; font-family:'JetBrains Mono',monospace; font-size:13px;
    letter-spacing:0.14em; text-transform:uppercase; padding:13px; background:var(--navy);
    color:var(--paper); border:none; border-radius:4px; cursor:pointer; transition:background 0.15s ease;
  }
  @media (hover:hover) and (pointer:fine){
    .next-btn:hover{ background:var(--navy-deep); }
  }

  .sr-only{
    position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden;
    clip:rect(0,0,0,0); white-space:nowrap; border:0;
  }

  @media (max-width:480px){
    body{ padding:20px 10px 40px; }
    .masthead{ margin-bottom:14px; }
    .masthead h1{ font-size:26px; }
    .masthead .eyebrow{ font-size:10px; }
    .mode-toggle{ flex-wrap:wrap; justify-content:center; max-width:100%; }
    .mode-toggle button{ font-size:12px; padding:11px 14px; min-height:40px; }
    .card{ padding:20px 16px 16px; }
    .row-top{ font-size:13px; }
    .flag-frame{ width:58%; }
    .flag-bar{ padding:10px 14px 12px; }
    .flag-caption{ margin-top:6px; }
    .flag-caption{ font-size:12px; }
    .options{ grid-template-columns:1fr; gap:10px; }
    .opt{ font-size:17px; padding:16px 12px; min-height:52px; }
    .type-input{ font-size:19px; padding:16px 14px; }
    .type-hint{ font-size:12px; }
    .stamp{ width:52px; height:52px; font-size:28px; }
    .statbar{ font-size:12px; }
    .statbar b{ font-size:16px; }
    .start p{ font-size:15px; }
    .begin-btn, .next-btn{ font-size:15px; padding:17px; min-height:52px; }
    .end .rank{ font-size:24px; }
    .end .rank-sub{ font-size:13px; }
    .end-stats .num{ font-size:22px; }
    .end-stats .lbl{ font-size:10px; }
    .missed{ font-size:14px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <h2 class="sr-only">Flag Guesser — identify each country from its flag, either by multiple choice or by typing the name, within a timed round.</h2>

  <div class="masthead" id="masthead">
    <p class="eyebrow">Guess the flag</p>
    <h1>Flag Guesser</h1>
    <div class="mode-toggle" id="modeToggle">
      <button data-mode="choice" class="active">Multiple choice</button>
      <button data-mode="type">Type answer</button>
    </div>
    <div class="mode-toggle" id="timeToggle" style="margin-top:8px;">
      <button data-time="3">3s</button>
      <button data-time="5">5s</button>
      <button data-time="10" class="active">10s</button>
    </div>
    <div class="mode-toggle" id="lengthToggle" style="margin-top:8px;">
      <button data-length="fixed" class="active">10 flags</button>
      <button data-length="infinite">Infinite</button>
    </div>
    <div class="mode-toggle" id="difficultyToggle" style="margin-top:8px;">
      <button data-difficulty="easy">Easy</button>
      <button data-difficulty="medium" class="active">Medium</button>
      <button data-difficulty="hard">Hard</button>
    </div>
    <div class="mode-toggle" id="playModeToggle" style="margin-top:8px;">
      <button data-play="solo" class="active">Solo</button>
      <button data-play="versus">Versus</button>
    </div>
  </div>

  <div class="flag-bar" id="flagBar" style="display:none;"></div>
  <div class="card" id="card"></div>
</div>

<script>
/* ---------- flag drawing helpers (self-contained vector flags, no network) ---------- */

function star(cx,cy,rOuter,rInner,points,fill,rot,extra){
  rot = rot===undefined ? -90 : rot;
  const pts=[];
  for(let i=0;i<points*2;i++){
    const r = i%2===0 ? rOuter : rInner;
    const angle = (Math.PI/points)*i + (rot*Math.PI/180);
    pts.push((cx+r*Math.cos(angle)).toFixed(1)+","+(cy+r*Math.sin(angle)).toFixed(1));
  }
  return '<polygon points="'+pts.join(' ')+'" fill="'+fill+'" '+(extra||'')+'/>';
}

function sunRays(cx,cy,r,color,rays){
  rays = rays || 16;
  let s = '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="'+color+'"/>';
  for(let i=0;i<rays;i++){
    const step = (Math.PI*2)/rays;
    const a1 = step*i;
    const rOuter = r*1.7, rInner = r*1.1;
    const x1 = cx+rInner*Math.cos(a1), y1 = cy+rInner*Math.sin(a1);
    const x2 = cx+rOuter*Math.cos(a1+step*0.25), y2 = cy+rOuter*Math.sin(a1+step*0.25);
    const x3 = cx+rInner*Math.cos(a1+step*0.5), y3 = cy+rInner*Math.sin(a1+step*0.5);
    s += '<polygon points="'+x1.toFixed(1)+','+y1.toFixed(1)+' '+x2.toFixed(1)+','+y2.toFixed(1)+' '+x3.toFixed(1)+','+y3.toFixed(1)+'" fill="'+color+'"/>';
  }
  return s;
}

function wheel(cx,cy,r,spokes,color){
  let s = '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="'+color+'" stroke-width="4"/><circle cx="'+cx+'" cy="'+cy+'" r="4" fill="'+color+'"/>';
  for(let i=0;i<spokes;i++){
    const a = (Math.PI*2/spokes)*i;
    s += '<line x1="'+cx+'" y1="'+cy+'" x2="'+(cx+r*Math.cos(a)).toFixed(1)+'" y2="'+(cy+r*Math.sin(a)).toFixed(1)+'" stroke="'+color+'" stroke-width="2.5"/>';
  }
  return s;
}

let clipCounter = 0;
function unionJack(x,y,w,h){
  clipCounter++;
  const cid = 'ukc'+clipCounter;
  const cx = x+w/2, cy = y+h/2;
  let s = '<clipPath id="'+cid+'"><rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'"/></clipPath><g clip-path="url(#'+cid+')">';
  s += '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="#012169"/>';
  s += '<line x1="'+x+'" y1="'+y+'" x2="'+(x+w)+'" y2="'+(y+h)+'" stroke="white" stroke-width="'+(h*0.3)+'"/>';
  s += '<line x1="'+(x+w)+'" y1="'+y+'" x2="'+x+'" y2="'+(y+h)+'" stroke="white" stroke-width="'+(h*0.3)+'"/>';
  s += '<line x1="'+x+'" y1="'+y+'" x2="'+(x+w)+'" y2="'+(y+h)+'" stroke="#C8102E" stroke-width="'+(h*0.1)+'"/>';
  s += '<line x1="'+(x+w)+'" y1="'+y+'" x2="'+x+'" y2="'+(y+h)+'" stroke="#C8102E" stroke-width="'+(h*0.1)+'"/>';
  s += '<rect x="'+(cx-w*0.09)+'" y="'+y+'" width="'+(w*0.18)+'" height="'+h+'" fill="white"/>';
  s += '<rect x="'+x+'" y="'+(cy-h*0.15)+'" width="'+w+'" height="'+(h*0.3)+'" fill="white"/>';
  s += '<rect x="'+(cx-w*0.05)+'" y="'+y+'" width="'+(w*0.1)+'" height="'+h+'" fill="#C8102E"/>';
  s += '<rect x="'+x+'" y="'+(cy-h*0.08)+'" width="'+w+'" height="'+(h*0.16)+'" fill="#C8102E"/>';
  s += '</g>';
  return s;
}

function hstripes(colors){
  const n = colors.length, bh = 200/n;
  let s='';
  for(let i=0;i<n;i++) s += '<rect x="0" y="'+(i*bh).toFixed(1)+'" width="300" height="'+(bh+0.6).toFixed(1)+'" fill="'+colors[i]+'"/>';
  return s;
}
function vstripes(colors){
  const n = colors.length, bw = 300/n;
  let s='';
  for(let i=0;i<n;i++) s += '<rect x="'+(i*bw).toFixed(1)+'" y="0" width="'+(bw+0.6).toFixed(1)+'" height="200" fill="'+colors[i]+'"/>';
  return s;
}
function hbands(bands){
  let y=0,s='';
  bands.forEach(b => { s += '<rect x="0" y="'+y.toFixed(1)+'" width="300" height="'+(b.h+0.6).toFixed(1)+'" fill="'+b.color+'"/>'; y+=b.h; });
  return s;
}
function vbands(bands){
  let x=0,s='';
  bands.forEach(b => { s += '<rect x="'+x.toFixed(1)+'" y="0" width="'+(b.w+0.6).toFixed(1)+'" height="200" fill="'+b.color+'"/>'; x+=b.w; });
  return s;
}
function nordicCross(bg,cross,barW,barX){
  return '<rect width="300" height="200" fill="'+bg+'"/><rect x="'+barX+'" y="0" width="'+barW+'" height="200" fill="'+cross+'"/><rect x="0" y="'+(100-barW/2)+'" width="300" height="'+barW+'" fill="'+cross+'"/>';
}
function crescentShape(cx,cy,r,offset,fill){
  clipCounter++;
  const mid='crm'+clipCounter;
  return '<mask id="'+mid+'"><rect x="0" y="0" width="300" height="200" fill="white"/><circle cx="'+(cx+offset)+'" cy="'+cy+'" r="'+r+'" fill="black"/></mask><circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="'+fill+'" mask="url(#'+mid+')"/>';
}

function diagLine(x1,y1,x2,y2,color,width){
  clipCounter++;
  const cid='dl'+clipCounter;
  return '<clipPath id="'+cid+'"><rect width="300" height="200"/></clipPath><g clip-path="url(#'+cid+')"><line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+color+'" stroke-width="'+width+'"/></g>';
}

function serrated(mainColor, edgeColor, edgeWidth, teeth){
  const pts = ['0,0'];
  const toothH = 200/teeth;
  for(let i=0;i<=teeth;i++){
    const y = i*toothH;
    pts.push(edgeWidth+','+y.toFixed(1));
    if(i<teeth) pts.push((edgeWidth-22)+','+(y+toothH/2).toFixed(1));
  }
  pts.push('0,200');
  return '<rect width="300" height="200" fill="'+mainColor+'"/><polygon points="'+pts.join(' ')+'" fill="'+edgeColor+'"/>';
}

function fanCorner(cx,cy,pointsArr,colors){
  let s='';
  for(let i=0;i<colors.length;i++){
    s += '<polygon points="'+cx+','+cy+' '+pointsArr[i]+' '+pointsArr[i+1]+'" fill="'+colors[i]+'"/>';
  }
  return s;
}

function flagBody(country){
  switch(country.kind){
    case 'h': return hstripes(country.colors);
    case 'v': return vstripes(country.colors);
    case 'hbands': return hbands(country.bands);
    case 'vbands': return vbands(country.bands);
    case 'nordic': return nordicCross(country.bg, country.cross, country.barW, country.barX);
    case 'circle': return '<rect width="300" height="200" fill="'+country.bg+'"/><circle cx="150" cy="100" r="'+country.r+'" fill="'+country.circleColor+'"/>';

    case 'custom': return country.render();
  }
  return '<rect width="300" height="200" fill="#ccc"/>';
}

function renderFlagSVG(country){
  let body = flagBody(country);
  if(country.overlay) body += country.overlay;
  return '<svg viewBox="0 0 300 200" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">'+body+'</svg>';
}

const EASY_SET = [
  "United States","United Kingdom","France","Germany","Italy","Spain","Portugal","Netherlands",
  "Switzerland","Sweden","Norway","Ireland","Greece","Poland","Russia","Ukraine","Turkey",
  "China","Japan","South Korea","India","Indonesia","Thailand","Vietnam","Philippines",
  "Saudi Arabia","Israel","Egypt","South Africa","Nigeria","Kenya","Morocco","Ghana","Ethiopia",
  "Brazil","Argentina","Mexico","Canada","Chile","Colombia","Peru","Cuba","Jamaica",
  "Australia","New Zealand"
];

const MEDIUM_SET = EASY_SET.concat([
  "Austria","Belgium","Denmark","Finland","Hungary","Czechia","Romania","Croatia","Serbia",
  "Iceland","Vietnam","Malaysia","Singapore","Pakistan","Bangladesh","Iran","Iraq","Jordan",
  "Lebanon","Qatar","United Arab Emirates","Kuwait","Algeria","Tunisia","Libya","Senegal",
  "Tanzania","Uganda","Zambia","Zimbabwe","Angola","Cameroon","Ecuador","Bolivia","Paraguay",
  "Uruguay","Venezuela","Guatemala","Honduras","Costa Rica","Panama","Dominican Republic"
]);

/* ---------- game logic ---------- */

const ROUNDS = 10;
let deck = [], round = 0, score = 0, bestStreak = 0, missed = [];
let pool = [], sessionBest = 0;
let streak = 0;
let locked = false, mode = 'choice', timeSetting = 10, infiniteMode = false, difficulty = 'medium', timerId = null, timeLeft = 0, gameStarted = false;

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

function levenshtein(a,b){
  const m=a.length,n=b.length;
  const dp=Array.from({length:m+1},()=>new Array(n+1).fill(0));
  for(let i=0;i<=m;i++) dp[i][0]=i;
  for(let j=0;j<=n;j++) dp[0][j]=j;
  for(let i=1;i<=m;i++){
    for(let j=1;j<=n;j++){
      if(a[i-1]===b[j-1]) dp[i][j]=dp[i-1][j-1];
      else dp[i][j]=1+Math.min(dp[i-1][j-1],dp[i-1][j],dp[i][j-1]);
    }
  }
  return dp[m][n];
}

function normalize(s){ return s.toLowerCase().replace(/[^a-z]/g,''); }

function thresholdFor(len){
  if(len<=3) return 0;
  if(len<=4) return 1;
  if(len<=6) return 2;
  if(len<=9) return 3;
  return 4;
}

function isCorrectGuess(typed, country){
  const a = normalize(typed);
  if(!a) return false;
  const candidates = [country.n];
  country.n.split(' ').forEach(w => { if(w.length>=4) candidates.push(w); });
  if(country.alt) candidates.push(...country.alt);
  for(const cand of candidates){
    const b = normalize(cand);
    const t = thresholdFor(b.length);
    if(Math.abs(a.length-b.length) > t) continue;
    if(levenshtein(a,b) <= t) return true;
  }
  return false;
}

function getPoolCountries(){
  if(difficulty === 'easy') return COUNTRIES.filter(c => EASY_SET.includes(c.n));
  if(difficulty === 'medium') return COUNTRIES.filter(c => MEDIUM_SET.includes(c.n));
  return COUNTRIES;
}

function buildDeck(){
  deck = shuffle(getPoolCountries()).slice(0, ROUNDS);
  round = 0; score = 0; bestStreak = 0; missed = [];
}

function refillPool(){ pool = shuffle(getPoolCountries()); }

function nextCountry(){
  const valid = new Set(getPoolCountries().map(c => c.n));
  while(pool.length && !valid.has(pool[pool.length-1].n)){
    pool.pop();
  }
  if(pool.length === 0){ refillPool(); }
  return pool.pop();
}

function makeOptions(correct){
  const candidates = getPoolCountries();
  const sameCont = candidates.filter(x => x.c === correct.c && x.n !== correct.n);
  const others = candidates.filter(x => x.c !== correct.c && x.n !== correct.n);
  const sameContCount = difficulty === 'easy' ? 0 : difficulty === 'hard' ? 3 : 2;
  const optPool = shuffle(sameCont).slice(0, sameContCount).concat(shuffle(others));
  const distractors = optPool.slice(0,3);
  return shuffle([correct, ...distractors]);
}

function stopTimer(){ if(timerId){ clearInterval(timerId); timerId=null; } }

function startTimer(limit, onExpire){
  timeLeft = limit;
  const fill = document.getElementById('timerFill');
  const label = document.getElementById('timerLabel');
  stopTimer();
  timerId = setInterval(() => {
    timeLeft -= 0.1;
    if(timeLeft < 0) timeLeft = 0;
    const pct = (timeLeft/limit)*100;
    if(fill){
      fill.style.width = pct + '%';
      fill.classList.toggle('low', timeLeft <= limit*0.3);
    }
    if(label) label.textContent = Math.ceil(timeLeft) + 's';
    if(timeLeft <= 0){
      stopTimer();
      onExpire();
    }
  }, 100);
}

function loadFlagInto(frameEl, country){
  frameEl.innerHTML = '';
  const img = document.createElement('img');
  img.alt = 'Flag to identify';
  img.style.opacity = '0';
  img.onload = function(){ img.style.opacity = '1'; };
  img.onerror = function(){ frameEl.innerHTML = renderFlagSVG(country); };
  frameEl.appendChild(img);
  img.src = 'flags/' + country.code + '.svg';
}

function renderStart(){
  document.getElementById('flagBar').style.display = 'none';
  document.getElementById('masthead').style.display = 'block';
  document.body.classList.remove('playing'); document.documentElement.classList.remove('locked');
  const card = document.getElementById('card');
  const lengthText = infiniteMode ? 'Flags keep coming, one after another, until you miss one.' : 'Ten flags — see how many you can get right.';
  card.innerHTML = `
    <div class="start">
      <p>${lengthText}<br>${mode==='choice' ? 'Pick the correct country from four options.' : 'Type the country name.'}<br>You get ${timeSetting} seconds per flag, on ${difficulty} difficulty.</p>
      ${infiniteMode && sessionBest ? `<p style="font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--teal-dark);margin-top:-8px;">session best streak: ${sessionBest}</p>` : ''}
      <button class="begin-btn" id="beginBtn">Start guessing</button>
    </div>
  `;
  document.getElementById('beginBtn').onclick = () => {
    gameStarted = true;
    streak = 0;
    if(infiniteMode){ refillPool(); } else { buildDeck(); }
    renderRound();
  };
}

function renderRound(){
  locked = false;
  document.getElementById('masthead').style.display = 'none';
  document.body.classList.add('playing'); document.documentElement.classList.add('locked');
  const country = infiniteMode ? nextCountry() : deck[round];
  const flagBar = document.getElementById('flagBar');
  const card = document.getElementById('card');
  flagBar.style.display = 'block';

  let bodyHtml = '';
  if(mode === 'choice'){
    bodyHtml = `<div class="options" id="options"></div>`;
  } else {
    bodyHtml = `
      <div class="type-wrap">
        <input type="text" class="type-input" id="typeInput" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Type the country name">
        <div class="type-hint">press enter to lock in your answer</div>
      </div>
    `;
  }

  const leadText = infiniteMode ? `Flag ${streak+1}` : `Entry ${round+1} / ${ROUNDS}`;
  const statHtml = infiniteMode
    ? `<div>streak<b>${streak}</b></div><div>best<b>${sessionBest}</b></div><div>timer<b>${timeSetting}s</b></div>`
    : `<div>score<b>${score} / ${round}</b></div><div>streak<b>${streak}</b></div><div>accuracy<b>${round ? Math.round(score/round*100) : 0}%</b></div>`;

  flagBar.innerHTML = `
    <div class="row-top">
      <span class="lead">${leadText}</span>
      <span id="timerLabel">${timeSetting}s</span>
    </div>
    <div class="timer-track"><div class="timer-fill" id="timerFill"></div></div>
    <div class="flag-stage">
      <div class="flag-frame" id="flagFrame" style="aspect-ratio:${country.sq ? '1/1' : '4/3'};"></div>
      <div class="flag-caption">country of origin?</div>
    </div>
  `;

  card.innerHTML = `
    ${bodyHtml}
    <div class="feedback-zone" id="feedback"></div>
    <div class="statbar">
      ${statHtml}
    </div>
  `;

  loadFlagInto(document.getElementById('flagFrame'), country);

  if(mode === 'choice'){
    const options = makeOptions(country);
    const optWrap = document.getElementById('options');
    options.forEach(opt => {
      const btn = document.createElement('button');
      btn.className = 'opt';
      btn.textContent = opt.n;
      btn.onclick = () => resolveRound(opt.n === country.n, country, btn);
      optWrap.appendChild(btn);
    });
  } else {
    const input = document.getElementById('typeInput');
    input.focus();
    const lockScroll = () => window.scrollTo(0, 0);
    input.addEventListener('focus', () => {
      [0,50,100,150,250,350,500].forEach(delay => setTimeout(lockScroll, delay));
    });
    lockScroll();
    [0,50,100,150,250,350,500].forEach(delay => setTimeout(lockScroll, delay));
    input.addEventListener('keydown', (e) => {
      if(e.key === 'Enter' && !locked){
        const ok = isCorrectGuess(input.value, country);
        if(ok) input.value = country.n;
        input.classList.add(ok ? 'good' : 'bad');
        resolveRound(ok, country, null, input);
      }
    });
  }

  startTimer(timeSetting, () => {
    if(locked) return;
    if(mode === 'choice'){
      document.querySelectorAll('.opt').forEach(b => {
        b.disabled = true;
        if(b.textContent === country.n) b.classList.add('reveal');
      });
      resolveRound(false, country, null, null, true);
    } else {
      const input = document.getElementById('typeInput');
      if(input){ input.value = country.n; input.classList.add('bad'); input.disabled = true; }
      resolveRound(false, country, null, input, true);
    }
  });
}

function resolveRound(isRight, country, btnEl, inputEl, timedOut){
  if(locked) return;
  locked = true;
  stopTimer();

  if(mode === 'choice'){
    document.querySelectorAll('.opt').forEach(b => {
      b.disabled = true;
      if(b.textContent === country.n) b.classList.add(isRight ? 'correct' : 'reveal');
    });
    if(btnEl && !isRight) btnEl.classList.add('wrong');
  } else if(inputEl){
    inputEl.disabled = true;
    inputEl.classList.remove('good','bad');
    inputEl.classList.add(isRight ? 'good' : 'bad');
  }

  const fb = document.getElementById('feedback');
  fb.innerHTML = isRight ? '' : `<div class="answer-reveal">Correct answer: <strong>${country.n}</strong></div>`;

  if(infiniteMode){
    if(isRight){
      streak++;
      sessionBest = Math.max(sessionBest, streak);
      setTimeout(() => { renderRound(); }, 900);
    } else {
      sessionBest = Math.max(sessionBest, streak);
      setTimeout(() => { renderEnd(country); }, 1300);
    }
  } else {
    if(isRight){
      score++; streak++;
      bestStreak = Math.max(bestStreak, streak);
    } else {
      streak = 0;
      missed.push(country);
    }
    setTimeout(() => {
      round++;
      if(round >= ROUNDS){ renderEnd(); } else { renderRound(); }
    }, isRight ? 900 : 1300);
  }
}

function rankForStreak(n){
  if(n >= 30) return ["Master Cartographer","never misreads a border"];
  if(n >= 20) return ["Seasoned Diplomat","well traveled, sharp eyed"];
  if(n >= 10) return ["Frequent Flyer","knows the major routes"];
  if(n >= 5) return ["Tourist Class","a few more stamps needed"];
  return ["Fresh Passport","the journey is just starting"];
}

function rankForPct(pct){
  if(pct === 100) return ["Master Cartographer","never misreads a border"];
  if(pct >= 80) return ["Seasoned Diplomat","well traveled, sharp eyed"];
  if(pct >= 60) return ["Frequent Flyer","knows the major routes"];
  if(pct >= 40) return ["Tourist Class","a few more stamps needed"];
  return ["Fresh Passport","the journey is just starting"];
}

function missedRow(country){
  const row = document.createElement('div');
  row.className = 'row';
  const img = document.createElement('img');
  img.src = 'flags/' + country.code + '.svg';
  img.alt = '';
  img.onerror = function(){ this.parentElement.innerHTML = renderFlagSVG(country); };
  row.innerHTML = `<span class="name"><span class="thumb"></span>${country.n}</span><span style="color:var(--crimson)">missed</span>`;
  row.querySelector('.thumb').appendChild(img);
  return row;
}

function renderEnd(missedCountry){
  document.getElementById('flagBar').style.display = 'none';
  document.getElementById('masthead').style.display = 'block';
  document.body.classList.remove('playing'); document.documentElement.classList.remove('locked');
  const card = document.getElementById('card');

  if(infiniteMode){
    const [rank, sub] = rankForStreak(streak);
    card.innerHTML = `
      <div class="end">
        <p class="flag-caption" style="margin-bottom:2px;">final review</p>
        <div class="rank">${rank}</div>
        <div class="rank-sub">${sub}</div>
        <div class="end-stats">
          <div><span class="num">${streak}</span><span class="lbl">Streak</span></div>
          <div><span class="num">${sessionBest}</span><span class="lbl">Session best</span></div>
          <div><span class="num" id="missedThumbSlot"></span><span class="lbl">Tripped up on</span></div>
        </div>
        <div class="missed" id="missedList"></div>
        <button class="next-btn" id="restartBtn">Play again</button>
      </div>
    `;
    const slot = document.getElementById('missedThumbSlot');
    slot.style.fontFamily = "'Fraunces',serif";
    slot.style.fontSize = '15px';
    slot.textContent = missedCountry.n;
    document.getElementById('missedList').appendChild(missedRow(missedCountry));
    document.getElementById('restartBtn').onclick = () => { streak = 0; refillPool(); renderRound(); };
  } else {
    const pct = Math.round(score/ROUNDS*100);
    const [rank, sub] = rankForPct(pct);
    card.innerHTML = `
      <div class="end">
        <p class="flag-caption" style="margin-bottom:2px;">final review</p>
        <div class="rank">${rank}</div>
        <div class="rank-sub">${sub}</div>
        <div class="end-stats">
          <div><span class="num">${score}/${ROUNDS}</span><span class="lbl">Correct</span></div>
          <div><span class="num">${pct}%</span><span class="lbl">Accuracy</span></div>
          <div><span class="num">${bestStreak}</span><span class="lbl">Best streak</span></div>
        </div>
        ${missed.length ? `<div class="missed" id="missedList"></div>` : `<div class="missed">Clean record — every flag identified.</div>`}
        <button class="next-btn" id="restartBtn">Play again</button>
      </div>
    `;
    if(missed.length){
      const list = document.getElementById('missedList');
      missed.forEach(m => list.appendChild(missedRow(m)));
    }
    document.getElementById('restartBtn').onclick = () => { buildDeck(); streak = 0; renderRound(); };
  }
}

/* ---------- versus mode (PeerJS — direct browser-to-browser, no account needed) ---------- */

let playMode = 'solo';
let peer = null;
let peerConn = null;
let versusRole = null;
let versusPin = null;
let versusName = '';
let versusOpponentName = '';
let versusMatchLength = 10;
let versusCurrentCountry = null;
let versusLocked = false;
let versusAdvanceTimer = null;
let versusState = null;

function versusCountryByCode(code){ return COUNTRIES.find(c => c.code === code); }

function makeVersusSequence(len){
  const src = getPoolCountries();
  const seq = [];
  while(seq.length < len){
    const shuffled = shuffle(src);
    for(const c of shuffled){
      if(seq.length >= len) break;
      seq.push(c.code);
    }
  }
  return seq;
}

function randomPin(){
  return String(Math.floor(1000 + Math.random()*9000));
}

function versusSend(msg){
  if(peerConn && peerConn.open){ peerConn.send(msg); }
}

function leaveVersusRoom(){
  if(versusAdvanceTimer){ clearTimeout(versusAdvanceTimer); versusAdvanceTimer = null; }
  if(peerConn){ try{ peerConn.close(); }catch(e){} peerConn = null; }
  if(peer){ try{ peer.destroy(); }catch(e){} peer = null; }
  versusPin = null;
  versusRole = null;
  versusOpponentName = '';
  versusState = null;
  stopTimer();
}

function renderVersusMenu(){

      <div class="mode-toggle" style="width:100%; justify-content:center; margin-bottom:14px;" id="versusLengthToggle">

function setVersusPending(isPending){
  const createBtn = document.getElementById('createRoomBtn');
  const joinBtn = document.getElementById('joinRoomBtn');
  const cancelBtn = document.getElementById('versusCancelBtn');
  if(createBtn) createBtn.disabled = isPending;
  if(joinBtn) joinBtn.disabled = isPending;
  if(cancelBtn) cancelBtn.style.display = isPending ? 'block' : 'none';
}

function setVersusStatus(msg){
  const el = document.getElementById('versusStatusMsg');
  if(el) el.textContent = msg;
}

const VERSUS_ICE_CONFIG = {
  iceServers: [
    { urls: 'stun:stun.l.google.com:19302' },
    { urls: 'stun:stun1.l.google.com:19302' },
    { urls: 'stun:stun2.l.google.com:19302' },
    { urls: 'turn:openrelay.metered.ca:80', username: 'openrelayproject', credential: 'openrelayproject' },
    { urls: 'turn:openrelay.metered.ca:443', username: 'openrelayproject', credential: 'openrelayproject' },
    { urls: 'turn:openrelay.metered.ca:443?transport=tcp', username: 'openrelayproject', credential: 'openrelayproject' }
  ]
};

function attachIceDiagnostics(conn){
  // diagnostics disabled — status text stays as-is
}

function createVersusRoom(){
  const pin = randomPin();
  versusPin = pin;
  versusRole = 'host';
  setVersusStatus('Opening room…');
  setVersusPending(true);
  peer = new Peer('flagguesser-'+pin, { config: VERSUS_ICE_CONFIG });
  const openTimeout = setTimeout(() => {
    setVersusStatus('Taking a while to open the room — check your connection and try again.');
  }, 12000);
  peer.on('open', () => {
    clearTimeout(openTimeout);
    versusState = {
      status: 'waiting',
      hostName: versusName,
      guestName: null,
      settings: { mode: mode, timeSetting: timeSetting, difficulty: difficulty, matchLength: versusMatchLength },
      flagSequence: makeVersusSequence(versusMatchLength === 'infinite' ? 40 : versusMatchLength),
      roundIndex: 0,
      scores: { host: 0, guest: 0 },
      currentRoundWinner: null,
      roundStartTime: null
    };
    renderVersusWaiting();
  });
  peer.on('connection', (conn) => {
    peerConn = conn;
    attachIceDiagnostics(conn);
    conn.on('data', (msg) => handleVersusMessage(msg, 'host'));
    conn.on('close', () => { setVersusStatus('Your friend disconnected.'); });
  });
  peer.on('error', (err) => {
    clearTimeout(openTimeout);
    setVersusStatus('Connection error (' + err.type + '). Try again, or make sure both of you have a stable connection.');
  });
}

function joinVersusRoom(pin){
  versusPin = pin;
  versusRole = 'guest';
  setVersusStatus('Connecting…');
  setVersusPending(true);
  peer = new Peer(undefined, { config: VERSUS_ICE_CONFIG });
  const connectTimeout = setTimeout(() => {
    setVersusStatus('Could not reach that room. Double check the PIN and that the host is still waiting.');
  }, 12000);
  peer.on('open', () => {
    const conn = peer.connect('flagguesser-'+pin, { reliable: true });
    peerConn = conn;
    attachIceDiagnostics(conn);
    conn.on('open', () => {
      clearTimeout(connectTimeout);
      versusSend({ type:'join', name: versusName });
    });
    conn.on('data', (msg) => handleVersusMessage(msg, 'guest'));
    conn.on('close', () => { setVersusStatus('Connection to host was lost.'); });
    conn.on('error', () => { clearTimeout(connectTimeout); setVersusStatus('Could not reach that room. Check the PIN.'); });
  });
  peer.on('error', (err) => {
    clearTimeout(connectTimeout);
    setVersusStatus('Connection error (' + err.type + '). Try again.');
  });
}

function broadcastVersusState(){
  versusSend({ type:'state', state: versusState });
}

function handleVersusMessage(msg, myRole){
  if(myRole === 'host'){
    if(msg.type === 'join'){
      versusState.guestName = msg.name;
      renderVersusWaiting();
      broadcastVersusState();
    } else if(msg.type === 'claim'){
      registerVersusWinner(msg.correct ? 'guest' : 'host');
    } else if(msg.type === 'leave'){
      setVersusStatus('Your friend left the room.');
    }
  } else {
    if(msg.type === 'state'){
      versusState = msg.state;
      handleVersusUpdate();
    }
  }
}

function handleVersusUpdate(){
  const data = versusState;
  if(!data) return;
  if(data.status === 'waiting'){
    renderVersusWaiting();
  } else if(data.status === 'playing'){
    if(versusCurrentCountry === null || versusLastRenderedRound !== data.roundIndex){
      versusLastRenderedRound = data.roundIndex;
      renderVersusRound();
    } else if(data.currentRoundWinner){
      renderVersusRoundResult();
    }
  } else if(data.status === 'finished'){
    renderVersusEnd();
  }
}
let versusLastRenderedRound = -1;

function renderVersusWaiting(){
  stopTimer();
  document.getElementById('flagBar').style.display = 'none';
  document.getElementById('masthead').style.display = 'block';
  document.body.classList.remove('playing'); document.documentElement.classList.remove('locked');
  const card = document.getElementById('card');
  const data = versusState;

  if(versusRole === 'host'){
    card.innerHTML = `
      <div class="start">
        <p class="flag-caption" style="margin-bottom:6px;">room pin</p>
        <div class="rank" style="letter-spacing:0.2em; font-size:40px;">${versusPin}</div>
        <p style="margin-top:14px;">${data.guestName ? `<strong>${data.guestName}</strong> has joined.` : 'Share this PIN with a friend.'}</p>
        <button class="begin-btn" id="startVersusBtn" ${data.guestName ? '' : 'disabled'}>Start match</button>
        <button class="next-btn" id="leaveVersusBtn" style="margin-top:10px;">Leave room</button>
      </div>
    `;
    if(data.guestName){
      document.getElementById('startVersusBtn').onclick = () => startVersusMatch();
    }
  } else {
    card.innerHTML = `
      <div class="start">
        <p>Joined room <strong>${versusPin}</strong>.</p>
        <p style="margin-top:6px;">Waiting for ${data.hostName} to start the match…</p>
        <button class="next-btn" id="leaveVersusBtn" style="margin-top:14px;">Leave room</button>
      </div>
    `;
  }
  document.getElementById('leaveVersusBtn').onclick = () => { versusSend({type:'leave'}); leaveVersusRoom(); renderVersusMenu(); };
}

function startVersusMatch(){
  versusState.status = 'playing';
  versusState.roundIndex = 0;
  versusState.currentRoundWinner = null;
  versusState.roundStartTime = Date.now();
  versusLastRenderedRound = -1;
  broadcastVersusState();
  renderVersusRound();
}

function renderVersusRound(){
  versusLocked = false;
  const data = versusState;
  const code = data.flagSequence[data.roundIndex % data.flagSequence.length];
  versusCurrentCountry = versusCountryByCode(code);
  const country = versusCurrentCountry;
  const gMode = data.settings.mode;
  const gTime = data.settings.timeSetting;
  versusOpponentName = versusRole === 'host' ? data.guestName : data.hostName;
  const myScore = versusRole === 'host' ? data.scores.host : data.scores.guest;
  const oppScore = versusRole === 'host' ? data.scores.guest : data.scores.host;

  const flagBar = document.getElementById('flagBar');
  const card = document.getElementById('card');
  document.getElementById('masthead').style.display = 'none';
  document.body.classList.add('playing'); document.documentElement.classList.add('locked');
  flagBar.style.display = 'block';

  let bodyHtml = '';
  if(gMode === 'choice'){
    bodyHtml = `<div class="options" id="options"></div>`;
  } else {
    bodyHtml = `
      <div class="type-wrap">
        <input type="text" class="type-input" id="typeInput" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Type the country name">
        <div class="type-hint">press enter to lock in your answer</div>
      </div>
    `;
  }

  const lenLabel = data.settings.matchLength === 'infinite' ? '∞' : data.settings.matchLength;

  flagBar.innerHTML = `
    <div class="row-top">
      <span class="lead">Round ${data.roundIndex+1}${data.settings.matchLength === 'infinite' ? '' : ' / '+lenLabel}</span>
      <span id="timerLabel">${gTime}s</span>
    </div>
    <div class="timer-track"><div class="timer-fill" id="timerFill"></div></div>
    <div class="flag-stage">
      <div class="flag-frame" id="flagFrame" style="aspect-ratio:${country.sq ? '1/1' : '4/3'};"></div>
      <div class="flag-caption">country of origin?</div>
    </div>
  `;

  card.innerHTML = `
    ${bodyHtml}
    <div class="feedback-zone" id="feedback"></div>
    <div class="statbar">
      <div>you<b>${myScore}</b></div>
      <div>${versusOpponentName || 'opponent'}<b>${oppScore}</b></div>
      <div>timer<b>${gTime}s</b></div>
    </div>
  `;

  document.getElementById('flagFrame').innerHTML = '';
  loadFlagInto(document.getElementById('flagFrame'), country);

  if(gMode === 'choice'){
    const options = makeOptions(country);
    const optWrap = document.getElementById('options');
    options.forEach(opt => {
      const btn = document.createElement('button');
      btn.className = 'opt';
      btn.textContent = opt.n;
      btn.onclick = () => {
        if(versusLocked) return;
        versusLocked = true;
        document.querySelectorAll('.opt').forEach(b => b.disabled = true);
        if(opt.n === country.n){
          btn.classList.add('correct');
          attemptVersusClaim(true);
        } else {
          btn.classList.add('wrong');
          attemptVersusClaim(false);
        }
      };
      optWrap.appendChild(btn);
    });
  } else {
    const input = document.getElementById('typeInput');
    input.focus();
    input.addEventListener('keydown', (e) => {
      if(e.key === 'Enter' && !versusLocked){
        versusLocked = true;
        input.disabled = true;
        const ok = isCorrectGuess(input.value, country);
        if(ok){
          input.value = country.n;
          input.classList.add('good');
        } else {
          input.classList.add('bad');
        }
        attemptVersusClaim(ok);
      }
    });
  }

  const startedAt = data.roundStartTime || Date.now();
  const elapsed = (Date.now() - startedAt) / 1000;
  const remaining = Math.max(0.1, gTime - elapsed);
  startTimer(gTime, () => {
    if(versusRole === 'host'){
      registerVersusWinner('none');
    }
  });
  if(remaining < gTime){ timeLeft = remaining; }
}

function attemptVersusClaim(wasCorrect){
  if(versusRole === 'host'){
    registerVersusWinner(wasCorrect ? 'host' : 'guest');
  } else {
    versusSend({ type:'claim', correct: wasCorrect });
  }
}

function registerVersusWinner(winner){
  if(versusRole !== 'host') return;
  if(versusState.currentRoundWinner) return;
  versusState.currentRoundWinner = winner;
  broadcastVersusState();
  renderVersusRoundResult();
  if(!versusAdvanceTimer){
    versusAdvanceTimer = setTimeout(() => { versusAdvanceTimer = null; advanceVersusRound(); }, 1800);
  }
}

function renderVersusRoundResult(){
  stopTimer();
  versusLocked = true;
  const data = versusState;
  const winner = data.currentRoundWinner;
  const country = versusCurrentCountry;
  if(!country) return;

  document.querySelectorAll('.opt').forEach(b => {
    b.disabled = true;
    if(b.textContent === country.n) b.classList.add('correct');
  });
  const input = document.getElementById('typeInput');
  if(input) input.disabled = true;

  const fb = document.getElementById('feedback');
  let label;
  if(winner === 'none') label = `Nobody got it — ${country.n}`;
  else if(winner === versusRole) label = `You got it first!`;
  else label = `${versusOpponentName || 'Opponent'} got it first — ${country.n}`;
  fb.innerHTML = `<div class="answer-reveal">${label}</div>`;
}

function advanceVersusRound(){
  if(versusRole !== 'host') return;
  const data = versusState;
  const winner = data.currentRoundWinner;
  if(winner === 'host') data.scores.host = (data.scores.host||0) + 1;
  if(winner === 'guest') data.scores.guest = (data.scores.guest||0) + 1;

  const nextIndex = data.roundIndex + 1;
  const isInfinite = data.settings.matchLength === 'infinite';
  const done = !isInfinite && nextIndex >= data.settings.matchLength;

  if(done){
    data.status = 'finished';
  } else {
    data.roundIndex = nextIndex;
    data.currentRoundWinner = null;
    data.roundStartTime = Date.now();
    if(isInfinite && nextIndex >= (data.flagSequence.length - 5)){
      data.flagSequence = data.flagSequence.concat(makeVersusSequence(40));
    }
  }
  broadcastVersusState();
  if(done){ renderVersusEnd(); } else { renderVersusRound(); }
}

function renderVersusEnd(){
  stopTimer();
  document.getElementById('flagBar').style.display = 'none';
  document.getElementById('masthead').style.display = 'block';
  document.body.classList.remove('playing'); document.documentElement.classList.remove('locked');
  const card = document.getElementById('card');
  const data = versusState;
  const myScore = versusRole === 'host' ? data.scores.host : data.scores.guest;
  const oppScore = versusRole === 'host' ? data.scores.guest : data.scores.host;
  const oppName = versusRole === 'host' ? data.guestName : data.hostName;
  let headline;
  if(myScore > oppScore) headline = 'You win!';
  else if(myScore < oppScore) headline = `${oppName} wins!`;
  else headline = "It's a tie!";

  card.innerHTML = `
    <div class="end">
      <p class="flag-caption" style="margin-bottom:2px;">match result</p>
      <div class="rank">${headline}</div>
      <div class="end-stats">
        <div><span class="num">${myScore}</span><span class="lbl">You</span></div>
        <div><span class="num">${oppScore}</span><span class="lbl">${oppName || 'Opponent'}</span></div>
      </div>
      <button class="next-btn" id="rematchBtn" style="margin-bottom:10px;">${versusRole === 'host' ? 'Rematch' : 'Wait for rematch'}</button>
      <button class="next-btn" id="leaveVersusEndBtn">Leave</button>
    </div>
  `;
  if(versusRole === 'host'){
    document.getElementById('rematchBtn').onclick = () => {
      versusState.status = 'waiting';
      versusState.roundIndex = 0;
      versusState.currentRoundWinner = null;
      versusState.roundStartTime = null;
      versusState.scores = { host: 0, guest: 0 };
      versusState.flagSequence = makeVersusSequence(data.settings.matchLength === 'infinite' ? 40 : data.settings.matchLength);
      versusLastRenderedRound = -1;
      broadcastVersusState();
      renderVersusWaiting();
    };
  } else {
    document.getElementById('rematchBtn').disabled = true;
  }
  document.getElementById('leaveVersusEndBtn').onclick = () => { versusSend({type:'leave'}); leaveVersusRoom(); renderVersusMenu(); };
}

});

document.getElementById('difficultyToggle').addEventListener('click', (e) => {
  const btn = e.target.closest('button[data-difficulty]');
  if(!btn) return;
  difficulty = btn.dataset.difficulty;
  document.getElementById('difficultyToggle').querySelectorAll('button').forEach(b => b.classList.toggle('active', b===btn));
  stopTimer();
  gameStarted = false;
  if(playMode === 'versus'){ leaveVersusRoom(); renderVersusMenu(); } else { renderStart(); }
});

document.getElementById('playModeToggle').addEventListener('click', (e) => {
  const btn = e.target.closest('button[data-play]');
  if(!btn) return;
  playMode = btn.dataset.play;
  document.getElementById('playModeToggle').querySelectorAll('button').forEach(b => b.classList.toggle('active', b===btn));
  stopTimer();
  gameStarted = false;
  if(playMode === 'versus'){ renderVersusMenu(); } else { leaveVersusRoom(); renderStart(); }
});

document.addEventListener('keydown', (e) => {
  if(e.key !== 'Enter') return;
  const active = document.activeElement;
  if(active && active.id === 'typeInput') return;
  const beginBtn = document.getElementById('beginBtn');
  const restartBtn = document.getElementById('restartBtn');
  if(beginBtn){ e.preventDefault(); beginBtn.click(); }
  else if(restartBtn){ e.preventDefault(); restartBtn.click(); }
});

if(window.visualViewport){
  window.visualViewport.addEventListener('resize', () => {
    const active = document.activeElement;
    if(active && active.id === 'typeInput'){
      window.scrollTo(0, 0);
    }
  });
}

renderStart();
</script>
</body>
</html>
